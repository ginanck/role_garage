---
# User and directory setup tasks for Garage

- name: Create garage group
  ansible.builtin.group:
    name: "{{ garage_group }}"
    system: true
    state: present

- name: Create garage user
  ansible.builtin.user:
    name: "{{ garage_user }}"
    group: "{{ garage_group }}"
    system: true
    shell: /bin/false
    home: "{{ garage_home }}"
    create_home: false
    comment: "Garage S3 storage service user"
    state: present

- name: Create garage configuration directory
  ansible.builtin.file:
    path: "{{ garage_config_dir }}"
    state: directory
    owner: root
    group: "{{ garage_group }}"
    mode: "0750"

- name: Create garage home directory
  ansible.builtin.file:
    path: "{{ garage_home }}"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "{{ garage_data_mode }}"

- name: Create garage metadata directory
  ansible.builtin.file:
    path: "{{ garage_metadata_dir }}"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "{{ garage_data_mode }}"

- name: Create garage data directory
  ansible.builtin.file:
    path: "{{ garage_data_dir }}"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "{{ garage_data_mode }}"

- name: Create garage log directory
  ansible.builtin.file:
    path: "/var/log/garage"
    state: directory
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    mode: "0755"
  when: garage_systemd_service.log_to_file | default(false)

- name: Set proper ownership for garage directories
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ garage_user }}"
    group: "{{ garage_group }}"
    recurse: true
  loop:
    - "{{ garage_home }}"
    - "{{ garage_metadata_dir }}"
    - "{{ garage_data_dir }}"
  when: item != garage_config_dir  # Config dir should be owned by root