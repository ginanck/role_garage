---
# Binary installation tasks for Garage

- name: Check if Garage is already installed
  ansible.builtin.stat:
    path: "{{ garage_bin_path }}"
  register: garage_binary_exists

- name: Get current Garage version if installed
  ansible.builtin.command:
    cmd: "{{ garage_bin_path }} --version"
  register: garage_current_version_output
  when: garage_binary_exists.stat.exists
  failed_when: false
  changed_when: false

- name: Set current version fact
  ansible.builtin.set_fact:
    garage_current_version: "{{ garage_current_version_output.stdout | regex_search('garage ([v0-9.]+)', '\\1') | first | default('unknown') }}"
  when: garage_binary_exists.stat.exists and garage_current_version_output.rc == 0

- name: Display installation status
  ansible.builtin.debug:
    msg: "Current: {{ garage_current_version | default('not installed') }} | Target: {{ garage_version }}"

- name: Stop Garage service if running
  ansible.builtin.systemd:
    name: garage
    state: stopped
  when: 
    - garage_binary_exists.stat.exists
    - garage_current_version | default('') != garage_version
  failed_when: false

- name: Download and install Garage binary
  ansible.builtin.get_url:
    url: "{{ garage_download_url }}"
    dest: "{{ garage_bin_path }}"
    mode: "0755"
    owner: root
    group: root
    timeout: "{{ garage_download_timeout }}"
    force: true
  when: garage_current_version | default('') != garage_version
  notify:
    - restart garage

- name: Create symlink for garage command (optional)
  ansible.builtin.file:
    src: "{{ garage_bin_path }}"
    dest: "/usr/bin/garage"
    state: link
    force: true
  when: garage_bin_path != "/usr/bin/garage"

- name: Verify Garage installation
  ansible.builtin.command:
    cmd: "{{ garage_bin_path }} --version"
  register: garage_final_version
  changed_when: false

- name: Display installation verification
  ansible.builtin.debug:
    msg: "Garage successfully installed: {{ garage_final_version.stdout }}"
