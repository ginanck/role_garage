---
# Binary installation tasks for Garage

- name: Check if Garage binary exists and get version
  ansible.builtin.command:
    cmd: "{{ garage_bin_path }} --version"
  register: garage_installed_version
  failed_when: false
  changed_when: false

- name: Parse installed version
  ansible.builtin.set_fact:
    garage_current_version: "{{ garage_installed_version.stdout | regex_search('garage ([v0-9.]+)', '\\1') | first }}"
  when: garage_installed_version.rc == 0

- name: Display current installation status
  ansible.builtin.debug:
    msg: "Current Garage version: {{ garage_current_version | default('not installed') }}, Target version: {{ garage_version }}"

- name: Download Garage binary
  ansible.builtin.get_url:
    url: "{{ garage_download_url }}"
    dest: "/tmp/garage-{{ garage_version }}"
    mode: "{{ garage_file_mode }}"
    timeout: "{{ garage_download_timeout }}"
    force: true
  register: garage_download
  retries: "{{ garage_download_retries }}"
  delay: 5
  when: >
    garage_current_version is not defined or
    garage_current_version != garage_version
  notify:
    - restart garage

- name: Verify downloaded binary is executable
  ansible.builtin.command:
    cmd: "/tmp/garage-{{ garage_version }} --version"
  register: garage_verify_download
  changed_when: false
  when: garage_download is changed

- name: Stop garage service before binary update
  ansible.builtin.systemd:
    name: garage
    state: stopped
  when:
    - garage_download is changed
    - garage_current_version is defined
  ignore_errors: true

- name: Install Garage binary
  ansible.builtin.copy:
    src: "/tmp/garage-{{ garage_version }}"
    dest: "{{ garage_bin_path }}"
    owner: root
    group: root
    mode: "{{ garage_file_mode }}"
    remote_src: true
  when: garage_download is changed
  notify:
    - restart garage

- name: Create symlink for garage command (optional)
  ansible.builtin.file:
    src: "{{ garage_bin_path }}"
    dest: "/usr/bin/garage"
    state: link
    force: true
  when: garage_bin_path != "/usr/bin/garage"

- name: Verify Garage installation
  ansible.builtin.command:
    cmd: "{{ garage_bin_path }} --version"
  register: garage_final_version
  changed_when: false

- name: Display installation verification
  ansible.builtin.debug:
    msg: "Garage successfully installed: {{ garage_final_version.stdout }}"

- name: Clean up temporary download file
  ansible.builtin.file:
    path: "/tmp/garage-{{ garage_version }}"
    state: absent
  when: garage_download is changed
